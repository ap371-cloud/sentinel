services:
  - type: web
    name: sentinel-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: SENTINEL_AIR_GAPPED
        value: "0"
      - key: SENTINEL_CORS_ORIGINS
        value: https://your-app.vercel.app
